name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agrocontrol
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: agrocontrol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrocontrol -d agrocontrol_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agrocontrol:ci-ephemeral-only@localhost:5432/agrocontrol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -c requirements.lock -e '.[dev]'
        working-directory: backend
      - run: ruff check . && ruff format --check . && pytest -q
        working-directory: backend
      - run: docker compose --env-file .env.example config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -c backend/requirements.lock -e 'backend[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test && npm run build
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:production
        working-directory: frontend
      - run: npm run test:online
        working-directory: frontend
      - run: npm run test:local
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
